services:
  db:
    image: "mysql/mysql-server:8.0.28"
    container_name: weblabs-prod-db
    volumes:
      - mysqldbvolume:/var/lib/mysql
    ports:
      - ${DB_PORT}:3306
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      TZ: ${APP_TIMEZONE}
    command: [mysqld, --default-authentication-plugin=mysql_native_password]
    restart: always
    healthcheck:
      test: "mysql $$DB_DATABASE -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1;'"
    network_mode: bridge

  migrations:
    build:
      context: .
    container_name: weblabs-prod-migrations
    working_dir: /app
    image: weblabs-app:prod
    command: php artisan migrate --no-interaction --force
    env_file: .env
    network_mode: bridge
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: "redis:6"
    container_name: weblabs-prod-redis
    command: >
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisvolume:/data
    env_file:
      - .env
    ports:
      - ${REDIS_PORT}:6379
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 1s
      timeout: 5s
      retries: 3
    network_mode: bridge

  app:
    working_dir: /app
    image: weblabs-app:prod
    container_name: weblabs-prod-app
    command: php artisan serve --host=0.0.0.0
    ports:
      - ${APP_PORT}:8000
    restart: always
    env_file:
      - .env
    network_mode: bridge
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

# Volumes
volumes:
  mysqldbvolume:
    driver: local
  redisvolume:
    driver: local
